// add function on 27 August 2026
async function loadCog(url, sourceId, layerId, opacity,attribution="") {

    const addedImage =
        'https://tiles.rdnt.io/tiles/{z}/{x}/{y}?url=' +
        encodeURIComponent(url);

    if (map.getSource(sourceId)) {

        if (map.getLayer(layerId)) {
            map.removeLayer(layerId);
        }

        map.removeSource(sourceId);
    }

    map.addSource(sourceId,{
        type:'raster',
        tiles:[addedImage],
        tileSize:256,
        minzoom:0,
        attribution: attribution
    });

    map.addLayer({
        id:layerId,
        source:sourceId,
        type:'raster',
        paint:{
            'raster-opacity':opacity
        }
   });

}

// XYZ/TMS形式のラスタータイルを直接表示する
async function loadRasterTiles(
    tileUrl,
    sourceId,
    layerId,
    opacity,
    scheme = "xyz",
    attribution = ""
) {
    // 同じIDのレイヤーがあれば削除
    if (map.getLayer(layerId)) {
        map.removeLayer(layerId);
    }

    // 同じIDのソースがあれば削除
    if (map.getSource(sourceId)) {
        map.removeSource(sourceId);
    }

    map.addSource(sourceId, {
        type: "raster",
        tiles: [tileUrl],
        tileSize: 256,
        minzoom: 0,
        maxzoom: 24,

        // XYZなら "xyz"、昔ながらのTMSなら "tms"
        scheme: scheme,
        attribution: attribution
    });

    map.addLayer({
        id: layerId,
        source: sourceId,
        type: "raster",
        paint: {
            "raster-opacity": opacity
        }
    });
}

// added on 2026-10-15
async function loadSTAC(
    url,
    sourceId,
    layerId,
    opacity,
    attribution = ""
) {
    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `STAC取得失敗: HTTP ${response.status}`
        );
    }

    const stac = await response.json();

    if (
        !stac.assets ||
        !stac.assets.visual ||
        !stac.assets.visual.href
    ) {
        throw new Error(
            "STACに assets.visual.href がありません"
        );
    }

    const cogUrl = stac.assets.visual.href;

    await loadCog(
        cogUrl,
        sourceId,
        layerId,
        opacity,
        attribution
    );

    let bounds = null;

    if (
        Array.isArray(stac.bbox) &&
        stac.bbox.length >= 4
    ) {
        bounds = [
            [stac.bbox[0], stac.bbox[1]],
            [stac.bbox[2], stac.bbox[3]]
        ];

        map.fitBounds(bounds, {
            padding: 30
        });
    }

    return {
        bounds: bounds,
        actualUrl: cogUrl
    };
}

// revised on 2026-10-15
async function loadTileJson(
    tilejsonUrl,
    sourceId,
    layerId,
    opacity,
    attribution=""
) {
    const response = await fetch(tilejsonUrl);

    if (!response.ok) {
        throw new Error(
            `TileJSON取得失敗: HTTP ${response.status}`
        );
    }

    const tj = await response.json();

    if (map.getLayer(layerId)) {
        map.removeLayer(layerId);
    }

    if (map.getSource(sourceId)) {
        map.removeSource(sourceId);
    }

    map.addSource(sourceId, {
        type: "raster",
        tiles: tj.tiles,
        tileSize: 256,
        attribution: attribution
    });

    map.addLayer({
        id: layerId,
        source: sourceId,
        type: "raster",
        paint: {
            "raster-opacity": opacity
        }
    });

    let bounds = null;

    if (
        Array.isArray(tj.bounds) &&
        tj.bounds.length >= 4
    ) {
        bounds = [
            [tj.bounds[0], tj.bounds[1]],
            [tj.bounds[2], tj.bounds[3]]
        ];

        map.fitBounds(bounds, {
            padding: 30
        });
    }

    return {
        bounds: bounds
    };
}

async function zoomToCog(url, moveImmediately = true) {

    let bounds = null;

    /*
     * Sentinel-2
     */
    if (
        url.includes("earth-search-sentinel-data") ||
        url.includes("sentinel-cogs")
    ) {
        try {
            const cleanUrl = url.split("?")[0];
            const parts = cleanUrl.split("/").filter(Boolean);

            // 通常、COGファイルの一つ上のフォルダーがSTAC Item ID
            const sceneId = decodeURIComponent(
                parts[parts.length - 2]
            );

            console.log("Sentinel-2 sceneId =", sceneId);

            /*
             * URLによって新旧コレクションが異なる可能性があるため、
             * 順番に検索する。
             */
            const collections = [
                "sentinel-2-c1-l2a",
                "sentinel-2-l2a",
                "sentinel-2-pre-c1-l2a"
            ];

            for (const collectionId of collections) {

                const response = await fetch(
                    "https://earth-search.aws.element84.com/v1/search",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            collections: [collectionId],
                            ids: [sceneId],
                            limit: 1
                        })
                    }
                );

                if (!response.ok) {
                    console.warn(
                        `${collectionId}: HTTP ${response.status}`
                    );
                    continue;
                }

                const result = await response.json();

                console.log(
                    `Earth Search result: ${collectionId}`,
                    result
                );

                if (
                    Array.isArray(result.features) &&
                    result.features.length > 0
                ) {
                    const item = result.features[0];

                    if (
                        Array.isArray(item.bbox) &&
                        item.bbox.length >= 4
                    ) {
                        bounds = [
                            [item.bbox[0], item.bbox[1]],
                            [item.bbox[2], item.bbox[3]]
                        ];

                        console.log(
                            "Sentinel-2 bounds =",
                            bounds
                        );

                        break;
                    }
                }
            }

            if (!bounds) {
                console.warn(
                    "Sentinel-2のSTAC Itemを取得できませんでした。",
                    "sceneId =",
                    sceneId
                );
            }

        } catch (error) {
            console.error(
                "Sentinel-2範囲取得エラー:",
                error
            );
        }
    }

    /*
     * Swisstopo
     */
    else if (url.includes("data.geo.admin.ch")) {

        try {
            const cleanUrl = url.split("?")[0];
            const parts = cleanUrl.split("/").filter(Boolean);

            const itemId =
                parts[parts.length - 2];

            const collectionId =
                parts[parts.length - 3];

            const stacUrl =
                "https://data.geo.admin.ch/api/stac/v0.9/" +
                `collections/${collectionId}/items/${itemId}`;

            console.log("Swisstopo STAC URL =", stacUrl);

            const response = await fetch(stacUrl);

            if (!response.ok) {
                throw new Error(
                    `Swisstopo STAC取得失敗: HTTP ${response.status}`
                );
            }

            const item = await response.json();

            if (
                Array.isArray(item.bbox) &&
                item.bbox.length >= 4
            ) {
                bounds = [
                    [item.bbox[0], item.bbox[1]],
                    [item.bbox[2], item.bbox[3]]
                ];
            }

        } catch (error) {
            console.error(
                "Swisstopo範囲取得エラー:",
                error
            );
        }
    }

    /*
     * 追加直後に画像範囲へ移動
     */
    if (bounds && moveImmediately) {
        map.fitBounds(bounds, {
            padding: 30,
            duration: 800
        });
    }

    return bounds;
}

// added on 2026-10-15    
async function getHotosmBoundsFromRasterUrl(url) {

    const match = url.match(
        /\/raster\/collections\/([^/]+)\/items\/([^/]+)\//
    );

    if (!match) {
        return null;
    }

    const collectionId = match[1];
    const itemId = match[2];

    const stacUrl =
        `https://api.imagery.hotosm.org/stac/collections/` +
        `${collectionId}/items/${itemId}`;

    const response = await fetch(stacUrl);

    if (!response.ok) {
        throw new Error(
            `HOTOSM STAC取得失敗: HTTP ${response.status}`
        );
    }

    const stac = await response.json();

    if (
        !Array.isArray(stac.bbox) ||
        stac.bbox.length < 4
    ) {
        return null;
    }

    return [
        [stac.bbox[0], stac.bbox[1]],
        [stac.bbox[2], stac.bbox[3]]
    ];
}

// 画像の種類に応じて読み込み処理を分岐 added on 2026-10-15
async function loadImageByType(
    imageType,
    url,
    sourceId,
    layerId,
    opacity
) {
    let bounds = null;
    const attribution = imageAttributions[imageType] || "";

    switch (imageType) {

        case "sentinel2":

            bounds = await zoomToCog(
                url,
                false
            );

            await loadCog(
                url,
                sourceId,
                layerId,
                opacity,
                attribution
            );

            if (bounds) {
                map.fitBounds(bounds, {
                    padding: 30,
                    duration: 800
                });
            }

        break;


        case "sentinel1": {

            const result = await loadTileJson(
                url,
                sourceId,
                layerId,
                opacity,
                attribution
            );

            bounds = result.bounds;
            break;
        }

        case "hotosm-tms":

            if (
                !url.includes("{z}") ||
                !url.includes("{x}") ||
                !url.includes("{y}")
            ) {
                throw new Error(
                    "HOTOSMタイルURLには {z}/{x}/{y} が必要です"
                );
            }

            await loadRasterTiles(
                url,
                sourceId,
                layerId,
                opacity,
                "xyz",
                attribution
            );

            bounds =
                await getHotosmBoundsFromRasterUrl(url);

            if (bounds) {
                map.fitBounds(bounds, {
                    padding: 30
                });
            }

            break;

        case "hotosm-stac": {

            const result = await loadSTAC(
                url,
                sourceId,
                layerId,
                opacity,
                attribution
            );

            bounds = result.bounds;
            break;
        }

        case "swisstopo":

            bounds = await zoomToCog(
                url,
                false
            );

            await loadCog(
                url,
                sourceId,
                layerId,
                opacity,
                attribution
            );

            if (bounds) {
                map.fitBounds(bounds, {
                    padding: 30,
                    duration: 800
                });
            }

            break;

        case "xyz":

            if (
                !url.includes("{z}") ||
                !url.includes("{x}") ||
                !url.includes("{y}")
            ) {
                throw new Error(
                    "XYZ/TMS URLには {z}/{x}/{y} が必要です"
                );
            }

            await loadRasterTiles(
                url,
                sourceId,
                layerId,
                opacity,
                "xyz",
                attribution
            );

            break;

        case "cog":

            bounds = await zoomToCog(
                url,
                false
            );

            await loadCog(
                url,
                sourceId,
                layerId,
                opacity
            );

            if (bounds) {
                map.fitBounds(bounds, {
                    padding: 30,
                    duration: 800
                });
            }

            break;

        default:

            throw new Error(
                "画像の種類が正しくありません"
            );
    }

    return {
        bounds: bounds
    };
}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatLayerBounds(bounds) {

    if (
        !Array.isArray(bounds) ||
        bounds.length < 2
    ) {
        return "範囲情報なし";
    }

    return (
        `西端：${bounds[0][0].toFixed(6)}<br>` +
        `南端：${bounds[0][1].toFixed(6)}<br>` +
        `東端：${bounds[1][0].toFixed(6)}<br>` +
        `北端：${bounds[1][1].toFixed(6)}`
    );
}

function showLayerInfo(layerData) {

    const typeLabel =
        imageTypeLabels[layerData.imageType] ||
        layerData.imageType;

    layerInfoContent.innerHTML = `
        <div class="modal-form-row">
            <label>画像名</label>
            <div>${escapeHtml(layerData.name)}</div>
        </div>

        <div class="modal-form-row">
            <label>画像の種類</label>
            <div>${escapeHtml(typeLabel)}</div>
        </div>

        <div class="modal-form-row">
            <label>透明度</label>
            <div>${layerData.opacity.toFixed(1)}</div>
        </div>

        <div class="modal-form-row">
            <label>画像範囲</label>
            <div>
                ${formatLayerBounds(layerData.bounds)}
            </div>
        </div>

        <div class="modal-form-row">
            <label>URL</label>
            <textarea
                rows="6"
                readonly
            >${escapeHtml(layerData.url)}</textarea>
        </div>
    `;

    layerInfoDialog.style.display = "block";
}

// 画像レイヤーのコントロールUIを作成する
function createDynamicLayerControl(layerData) {

    const layerList =
        document.getElementById("dynamicLayerList");

    const item =
        document.createElement("div");

    item.className = "dynamic-layer-item";

    const header =
        document.createElement("div");

    header.className = "dynamic-layer-header";

    const visibleCheckbox =
        document.createElement("input");

    visibleCheckbox.type = "checkbox";
    visibleCheckbox.checked = true;
    visibleCheckbox.title = "表示／非表示";

    const nameContainer =
        document.createElement("div");

    nameContainer.className =
        "dynamic-layer-name";

    nameContainer.textContent =
        layerData.name;

    const buttonContainer =
        document.createElement("div");

    buttonContainer.className =
        "dynamic-layer-buttons";

    const zoomButton =
        document.createElement("button");

    zoomButton.type = "button";
    zoomButton.textContent = "移動";
    zoomButton.className = "zoom-layer-button";

    if (!layerData.bounds) {
        zoomButton.disabled = true;
        zoomButton.title =
            "この画像には表示範囲情報がありません";
    }

    const deleteButton =
        document.createElement("button");

    deleteButton.type = "button";
    deleteButton.textContent = "削除";
    deleteButton.className =
        "delete-layer-button";

    buttonContainer.appendChild(zoomButton);
    buttonContainer.appendChild(deleteButton);

    header.appendChild(visibleCheckbox);
    header.appendChild(nameContainer);
    header.appendChild(buttonContainer);

    const typeText =
        document.createElement("div");

    typeText.className = "dynamic-layer-type";

    typeText.textContent =
        imageTypeLabels[layerData.imageType] ||
        layerData.imageType;

    const opacityRow =
        document.createElement("div");

    opacityRow.className =
        "dynamic-opacity-row";

    const opacityLabel =
        document.createElement("span");

    opacityLabel.textContent = "透明度";

    const opacitySlider =
        document.createElement("input");

    opacitySlider.type = "range";
    opacitySlider.min = "0";
    opacitySlider.max = "10";
    opacitySlider.step = "1";

    opacitySlider.value = String(
        Math.round(layerData.opacity * 10)
    );

    const opacityValue =
        document.createElement("span");

    opacityValue.className =
        "opacity-value";

    opacityValue.textContent =
        layerData.opacity.toFixed(1);

    /* 情報ボタン */
    const infoButton =
        document.createElement("button");

    infoButton.type = "button";
    infoButton.textContent = "情報";
    infoButton.className =
        "layer-info-button";

/* i ボタン */
    const infoIcon =
        document.createElement("button");

    infoIcon.type = "button";
    infoIcon.textContent = "i";
    infoIcon.className =
        "layer-info-icon";

    infoIcon.title =
        "画像レイヤー情報を表示";

    /* 情報ボタンのクリック */
    infoButton.addEventListener(
        "click",
        function () {
            showLayerInfo(layerData);
        }
    );


    /* i ボタンのクリック */
    infoIcon.addEventListener(
        "click",
        function () {
            showLayerInfo(layerData);
        }
    );

    opacityRow.appendChild(opacityLabel);
    opacityRow.appendChild(opacitySlider);
    opacityRow.appendChild(opacityValue);
    opacityRow.appendChild(infoButton);
    opacityRow.appendChild(infoIcon);

    item.appendChild(header);
    item.appendChild(typeText);
    item.appendChild(opacityRow);

//

    layerList.appendChild(item);

    layerData.element = item;

    visibleCheckbox.addEventListener(
        "change",
        function () {

            if (!map.getLayer(layerData.layerId)) {
                return;
            }

            map.setLayoutProperty(
                layerData.layerId,
                "visibility",
                visibleCheckbox.checked
                    ? "visible"
                    : "none"
            );
        }
    );

    opacitySlider.addEventListener(
        "input",
        function () {

            if (!map.getLayer(layerData.layerId)) {
                return;
            }

            const opacity =
                Number(opacitySlider.value) / 10;

            opacityValue.textContent =
                opacity.toFixed(1);

            layerData.opacity = opacity;

            map.setPaintProperty(
                layerData.layerId,
                "raster-opacity",
                opacity
            );
        }
    );

    zoomButton.addEventListener(
        "click",
        function () {

            if (!layerData.bounds) {
                return;
            }

            map.fitBounds(
                layerData.bounds,
                {
                    padding: 30
                }
            );
        }
    );

    deleteButton.addEventListener(
        "click",
        function () {

            if (map.getLayer(layerData.layerId)) {
                map.removeLayer(layerData.layerId);
            }

            if (map.getSource(layerData.sourceId)) {
                map.removeSource(layerData.sourceId);
            }

            dynamicLayerData.delete(
                layerData.layerId
            );

            item.remove();

            updateNoLayerMessage();
        }
    );

    dynamicLayerData.set(
        layerData.layerId,
        layerData
    );

    updateNoLayerMessage();
}

document
    .getElementById("loadNewImageButton")
    .addEventListener("click", async function () {

        const imageType =
            imageTypeInput.value;

        const imageName =
            newImageNameInput.value.trim();

        const url =
            newImageUrlInput.value.trim();

        const opacity =
            Number(newImageOpacityInput.value) / 10;

        if (!url) {
            imageDialogMessage.style.color =
                "#c62828";

            imageDialogMessage.textContent =
                "URLを入力してください。";

            return;
        }

        dynamicLayerCounter += 1;

        const sourceId =
            `dynamic-image-${dynamicLayerCounter}`;

        const layerId =
            `dynamic-image-${dynamicLayerCounter}-layer`;

        const displayName =
            imageName ||
            `画像 ${dynamicLayerCounter}`;

        const loadButton =
            document.getElementById(
                "loadNewImageButton"
            );

        loadButton.disabled = true;

        imageDialogMessage.style.color = "#333";
        imageDialogMessage.textContent =
            "画像を読み込んでいます...";

        try {
            const result = await loadImageByType(
                imageType,
                url,
                sourceId,
                layerId,
                opacity
            );

            createDynamicLayerControl({
                name: displayName,
                imageType: imageType,
                url: url,
                sourceId: sourceId,
                layerId: layerId,
                opacity: opacity,
                bounds: result.bounds
            });

            newImageNameInput.value = "";
            newImageUrlInput.value = "";

            imageDialogMessage.style.color =
                "green";

            imageDialogMessage.textContent =
                `${displayName}を追加しました。`;

            setTimeout(function () {
                closeImageDialog();
            }, 400);

        } catch (error) {

            console.error(
                "画像レイヤー追加エラー:",
                error
            );

            if (map.getLayer(layerId)) {
                map.removeLayer(layerId);
            }

            if (map.getSource(sourceId)) {
                map.removeSource(sourceId);
            }

            imageDialogMessage.style.color =
                "#c62828";

            imageDialogMessage.textContent =
                `追加できませんでした: ${error.message}`;

        } finally {
            loadButton.disabled = false;
        }
    });
